  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input class="file-input" id="background-file" type="file" accept="image/*" tabindex="-1" aria-hidden="true" aria-label="选择背景照片">

  <script>
    (() => {
      const STORAGE_KEY = "collage_poetry_history";
      const RAIN_DROPLET_COUNT = 60;
      const RAIN_FALL_DURATION = 1.45;
      const SNOW_PARTICLE_COUNT = 72;
      const WEATHER_TYPES = ["sunny", "overcast", "cloudy", "rain", "snow", "fog", "wind"];
      let today = new Date();
      let dateLabel = "";
      let shortDate = "";
      const shortDateFormatter = new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      const styles = ["plain", "outline", "ink", "plain"];

      function formatDateStamp(value) {
        return `${value.getFullYear()}.${String(value.getMonth() + 1).padStart(2, "0")}.${String(value.getDate()).padStart(2, "0")}`;
      }

      function formatShortDate(value) {
        return shortDateFormatter.format(value);
      }

      dateLabel = formatDateStamp(today);
      shortDate = formatShortDate(today);

      const state = {
        selectedType: "景色",
        mode: "free",
        chips: [],
        selectedId: null,
        nextId: 1,
        activeSheet: null,
        weather: "sunny",
        weatherChosen: false,
        weatherEffectActive: false,
        backgroundImage: "",
        backgroundImageElement: null,
        backgroundTransform: { x: 0, y: 0, scale: 1 },
        defaultArtImage: null
      };
      let chipControlsTimer = null;

      const elements = {
        appShell: document.querySelector(".app-shell"),
        canvas: document.getElementById("poetry-canvas"),
        layout: document.getElementById("layout-wrapper"),
        date: document.getElementById("display-date"),
        typeStrip: document.getElementById("type-strip"),
        input: document.getElementById("input-word"),
        wordForm: document.getElementById("word-form"),
        selectedTypeLabel: document.getElementById("selected-type-label"),
        addButton: document.getElementById("btn-open-composer"),
        menuButton: document.getElementById("btn-menu"),
        historyButton: document.getElementById("btn-history"),
        exportButton: document.getElementById("btn-export"),
        copyButton: document.getElementById("btn-copy-poem"),
        clearTextButton: document.getElementById("btn-clear-text"),
        clearWeatherButton: document.getElementById("btn-clear-weather"),
        removeBackgroundButton: document.getElementById("btn-remove-background"),
        backgroundStatus: document.getElementById("background-status"),
        backgroundFile: document.getElementById("background-file"),
        customBackgroundImage: document.getElementById("custom-background-image"),
        rainLayer: document.querySelector(".rain-layer"),
        snowLayer: document.querySelector(".snow-layer"),
        historyList: document.getElementById("history-list"),
        scrim: document.getElementById("sheet-scrim"),
        toast: document.getElementById("toast"),
        weatherPicker: document.getElementById("weather-picker"),
        weatherTrigger: document.getElementById("weather-trigger"),
        currentWeatherIcon: document.getElementById("current-weather-icon"),
        weatherButtons: Array.from(document.querySelectorAll(".weather-btn")),
        sheets: {
          composer: document.getElementById("composer-sheet"),
          menu: document.getElementById("menu-sheet"),
          history: document.getElementById("history-sheet")
        }
      };

      elements.date.textContent = shortDate;

      function setWeather(weather, activate = true) {
        state.weather = WEATHER_TYPES.indexOf(weather) >= 0 ? weather : "sunny";
        if (activate) {
          state.weatherChosen = true;
          state.weatherEffectActive = true;
        }
        WEATHER_TYPES.forEach((name) => {
          elements.appShell.classList.toggle(
            `weather-${name}`,
            state.weatherEffectActive && name === state.weather
          );
        });
        elements.weatherButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(state.weatherChosen && button.dataset.weather === state.weather)
          );
        });
        if (state.weatherChosen) {
          const selectedButton = elements.weatherButtons.find(
            (button) => button.dataset.weather === state.weather
          );
          const selectedIcon = selectedButton && selectedButton.querySelector(".weather-icon");
          elements.currentWeatherIcon.innerHTML = selectedIcon ? selectedIcon.innerHTML : "";
          elements.weatherTrigger.classList.add("is-visible");
          elements.addButton.classList.remove("is-hidden");
          elements.addButton.disabled = false;
        } else {
          elements.currentWeatherIcon.innerHTML = "";
          elements.weatherTrigger.classList.remove("is-visible");
          elements.addButton.classList.add("is-hidden");
          elements.addButton.disabled = true;
        }
        if (activate) closeWeatherPicker();
      }

      function clearWeatherEffect() {
        state.weatherEffectActive = false;
        WEATHER_TYPES.forEach((name) => {
          elements.appShell.classList.remove(`weather-${name}`);
        });
      }

      function openWeatherPicker() {
        elements.weatherPicker.classList.remove("is-hidden");
        elements.weatherPicker.setAttribute("aria-hidden", "false");
      }

      function closeWeatherPicker() {
        elements.weatherPicker.classList.add("is-hidden");
        elements.weatherPicker.setAttribute("aria-hidden", "true");
      }

      function getRainX(index, count) {
        const slot = (index + 0.5) / count;
        const band = Math.min(9, Math.floor(slot * 10));
        const jitter = (((index * 17) % 7) - 3) * 0.0025;
        return Math.min((band + 1) / 10 - 0.01, Math.max(band / 10 + 0.01, slot + jitter));
      }

      function prepareRainParticles() {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < RAIN_DROPLET_COUNT; i += 1) {
          const drop = document.createElement("span");
          drop.style.left = `${getRainX(i, RAIN_DROPLET_COUNT) * 100}%`;
          drop.style.top = "-24px";
          drop.style.width = `${i % 7 === 0 ? 1.4 : 0.9}px`;
          drop.style.height = `${14 + (i * 7) % 20}px`;
          drop.style.opacity = `${0.26 + (i % 5) * 0.07}`;
          drop.style.animationDuration = `${RAIN_FALL_DURATION}s`;
          const phaseIndex = (i * 23) % RAIN_DROPLET_COUNT;
          drop.style.animationDelay =
            `-${((phaseIndex + 0.5) / RAIN_DROPLET_COUNT * RAIN_FALL_DURATION).toFixed(2)}s`;
          drop.style.setProperty("--static-top", `${2 + (i * 43 + (i % 6) * 7) % 92}%`);
          fragment.appendChild(drop);
        }
        elements.rainLayer.appendChild(fragment);
      }

      function prepareSnowParticles() {
        const fragment = document.createDocumentFragment();
        const snowCount = SNOW_PARTICLE_COUNT;
        const edgeCount = 10;
        for (let i = 0; i < snowCount; i += 1) {
          const flake = document.createElement("span");
          const sizeSeed = (i * 0.61803398875 + 0.37) % 1;
          const size = 1.3 + Math.pow(sizeSeed, 1.8) * 6.9;
          const opacity = 0.38 + ((i * 11) % 46) / 100;
          const duration = 12 + ((i * 13) % 11);
          const delay = -(((i * 29) % 230) / 10);
          const isEdge = i < edgeCount || i >= snowCount - edgeCount;
          const driftScale = isEdge ? 0.58 : 1;
          const startDrift = (-30 + ((i * 31) % 61)) * driftScale;
          const middleDrift = (-52 + ((i * 47) % 105)) * driftScale;
          const endDrift = (-34 + ((i * 19) % 69)) * driftScale;
          let leftPercent;

          if (i < edgeCount) {
            leftPercent = 2.5 + ((i * 17) % 7);
          } else if (i >= snowCount - edgeCount) {
            leftPercent = 91.5 + (((i - snowCount + edgeCount) * 13) % 7);
          } else {
            const middleIndex = i - edgeCount;
            const middleCount = snowCount - edgeCount * 2;
            leftPercent =
              10 +
              ((middleIndex + 0.5) / middleCount) * 80 +
              (((middleIndex * 17) % 7) - 3) * 0.35;
          }

          flake.style.left = `${leftPercent.toFixed(2)}%`;
          flake.style.setProperty("--snow-size", `${size.toFixed(1)}px`);
          flake.style.setProperty("--snow-opacity", opacity.toFixed(2));
          flake.style.setProperty("--snow-duration", `${duration}s`);
          flake.style.setProperty("--snow-delay", `${delay}s`);
          const blur = size > 5.4 ? 0.75 : size > 2.8 ? 0.42 : 0.16;
          flake.style.setProperty("--snow-blur", `${blur}px`);
          flake.style.setProperty("--snow-drift-start", `${startDrift}px`);
          flake.style.setProperty("--snow-drift-middle", `${middleDrift}px`);
          flake.style.setProperty("--snow-drift-end", `${endDrift}px`);
          fragment.appendChild(flake);
        }
        elements.snowLayer.appendChild(fragment);
      }

      function refreshDate(force = false) {
        const now = new Date();
        const nextDateLabel = formatDateStamp(now);
        const nextShortDate = formatShortDate(now);
        if (!force && nextDateLabel === dateLabel && nextShortDate === shortDate) return;

        today = now;
        dateLabel = nextDateLabel;
        shortDate = nextShortDate;
        elements.date.textContent = shortDate;
      }

      function scheduleDateRefresh() {
        const now = new Date();
        const nextMidnight = new Date(now);
        nextMidnight.setHours(24, 0, 0, 80);
        window.setTimeout(() => {
          refreshDate(true);
          scheduleDateRefresh();
        }, nextMidnight.getTime() - now.getTime());
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function showToast(message) {
        window.clearTimeout(showToast.timer);
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        showToast.timer = window.setTimeout(() => {
          elements.toast.classList.remove("show");
        }, 2300);
      }

      function getFreeBounds() {
        const width = elements.layout.clientWidth || 300;
        const height = elements.layout.clientHeight || 360;
        return { width, height };
      }

      function keepChipInBounds(chip, element) {
        if (state.mode !== "free") return;
        const bounds = getFreeBounds();
        const maxX = Math.max(0, bounds.width - Math.min(element.offsetWidth, bounds.width));
        const maxY = Math.max(0, bounds.height - Math.min(element.offsetHeight, bounds.height));
        chip.x = Math.min(Math.max(0, chip.x), maxX);
        chip.y = Math.min(Math.max(0, chip.y), maxY);
        element.style.left = `${chip.x}px`;
        element.style.top = `${chip.y}px`;
      }

      function loadImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("无法读取这张照片"));
          image.src = source;
        });
      }

      async function prepareDefaultArtwork() {
        const svg = elements.canvas.querySelector(".canvas-default-art svg");
        if (!svg) return;
        const serialized = new XMLSerializer().serializeToString(svg);
        const source = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(serialized)}`;
        try {
          state.defaultArtImage = await loadImage(source);
        } catch {
          state.defaultArtImage = null;
        }
      }

      function compressPhoto(image) {
        const maxSide = 1400;
        const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#fbfbfa";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return {
          dataUrl: canvas.toDataURL("image/jpeg", 0.82),
          element: canvas
        };
      }

      function applyBackgroundState() {
        const hasPhoto = Boolean(state.backgroundImage && state.backgroundImageElement);
        elements.canvas.classList.toggle("using-photo", hasPhoto);
        elements.appShell.classList.toggle("has-photo-background", hasPhoto);
        if (hasPhoto) {
          if (elements.customBackgroundImage.src !== state.backgroundImage) {
            elements.customBackgroundImage.src = state.backgroundImage;
          }
          clampBackgroundTransform();
        } else {
          elements.customBackgroundImage.removeAttribute("src");
          renderBackgroundTransform();
        }
        elements.removeBackgroundButton.disabled = !hasPhoto;
        elements.backgroundStatus.textContent = hasPhoto
          ? "当前使用相册照片"
          : "当前为默认黑白背景";
      }

      function renderBackgroundTransform() {
        const transform = state.backgroundTransform;
        elements.customBackgroundImage.style.transform =
          `translate3d(${transform.x}px, ${transform.y}px, 0) scale(${transform.scale})`;
      }

      function clampBackgroundTransform() {
        if (!state.backgroundImageElement) return;
        const canvasWidth = elements.canvas.clientWidth;
        const canvasHeight = elements.canvas.clientHeight;
        const image = state.backgroundImageElement;
        const imageWidth = image.naturalWidth || image.width;
        const imageHeight = image.naturalHeight || image.height;
        const coverScale = Math.max(canvasWidth / imageWidth, canvasHeight / imageHeight);
        const scale = Math.min(4, Math.max(1, Number(state.backgroundTransform.scale) || 1));
        const scaledWidth = imageWidth * coverScale * scale;
        const scaledHeight = imageHeight * coverScale * scale;
        const maxX = Math.max(0, (scaledWidth - canvasWidth) / 2);
        const maxY = Math.max(0, (scaledHeight - canvasHeight) / 2);

        state.backgroundTransform = {
          x: Math.min(maxX, Math.max(-maxX, Number(state.backgroundTransform.x) || 0)),
          y: Math.min(maxY, Math.max(-maxY, Number(state.backgroundTransform.y) || 0)),
          scale
        };
        renderBackgroundTransform();
      }

      async function usePhotoBackground(file) {
        if (!file?.type.startsWith("image/")) {
          showToast("请选择一张图片");
          return;
        }
        if (file.size > 25 * 1024 * 1024) {
          showToast("图片过大，请选择 25MB 以内的照片");
          return;
        }

        const objectUrl = URL.createObjectURL(file);
        try {
          const sourceImage = await loadImage(objectUrl);
          const compressed = compressPhoto(sourceImage);
          state.backgroundImage = compressed.dataUrl;
          state.backgroundImageElement = compressed.element;
          state.backgroundTransform = { x: 0, y: 0, scale: 1 };
          applyBackgroundState();
          closeSheet();
          showToast("背景照片已更换");
        } catch (error) {
          console.error(error);
          showToast("这张照片暂时无法使用");
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }

      async function restoreBackground(dataUrl, transform) {
        if (!dataUrl) {
          state.backgroundImage = "";
          state.backgroundImageElement = null;
          state.backgroundTransform = { x: 0, y: 0, scale: 1 };
          applyBackgroundState();
          return;
        }

        try {
          const image = await loadImage(dataUrl);
          state.backgroundImage = dataUrl;
          state.backgroundImageElement = image;
          state.backgroundTransform = {
            x: Number(transform && transform.x) || 0,
            y: Number(transform && transform.y) || 0,
            scale: Math.min(4, Math.max(1, Number(transform && transform.scale) || 1))
          };
        } catch {
          state.backgroundImage = "";
          state.backgroundImageElement = null;
          state.backgroundTransform = { x: 0, y: 0, scale: 1 };
        }
        applyBackgroundState();
      }

      const backgroundPointers = new Map();
      let backgroundGesture = null;

      function getBackgroundPointerCenter(points) {
        return {
          x: (points[0].x + points[1].x) / 2,
          y: (points[0].y + points[1].y) / 2
        };
      }

      function getBackgroundPointerDistance(points) {
        return Math.max(1, Math.hypot(
          points[1].x - points[0].x,
          points[1].y - points[0].y
        ));
      }

      function startBackgroundPan() {
        const points = Array.from(backgroundPointers.values());
        if (!points.length) return;
        backgroundGesture = {
          type: "pan",
          startX: points[0].x,
          startY: points[0].y,
          originX: state.backgroundTransform.x,
          originY: state.backgroundTransform.y,
          startScale: state.backgroundTransform.scale
        };
      }

      function startBackgroundPinch() {
        const points = Array.from(backgroundPointers.values()).slice(0, 2);
        if (points.length < 2) return;
        const center = getBackgroundPointerCenter(points);
        const rect = elements.canvas.getBoundingClientRect();
        const canvasCenterX = rect.left + rect.width / 2;
        const canvasCenterY = rect.top + rect.height / 2;
        const transform = state.backgroundTransform;
        backgroundGesture = {
          type: "pinch",
          startDistance: getBackgroundPointerDistance(points),
          startScale: transform.scale,
          localX: (center.x - canvasCenterX - transform.x) / transform.scale,
          localY: (center.y - canvasCenterY - transform.y) / transform.scale
        };
      }

      function updateBackgroundGesture(points) {
        if (!backgroundGesture || !points.length) return;
        const rect = elements.canvas.getBoundingClientRect();

        if (points.length >= 2) {
          if (backgroundGesture.type !== "pinch") startBackgroundPinch();
          if (!backgroundGesture || backgroundGesture.type !== "pinch") return;
          const center = getBackgroundPointerCenter(points);
          const scale = Math.min(4, Math.max(
            1,
            backgroundGesture.startScale *
              getBackgroundPointerDistance(points) /
              backgroundGesture.startDistance
          ));
          state.backgroundTransform = {
            x: center.x - rect.left - rect.width / 2 - backgroundGesture.localX * scale,
            y: center.y - rect.top - rect.height / 2 - backgroundGesture.localY * scale,
            scale
          };
        } else if (backgroundGesture.type === "pan") {
          const point = points[0];
          state.backgroundTransform = {
            x: backgroundGesture.originX + point.x - backgroundGesture.startX,
            y: backgroundGesture.originY + point.y - backgroundGesture.startY,
            scale: backgroundGesture.startScale || state.backgroundTransform.scale
          };
        }
        clampBackgroundTransform();
      }

      function enableBackgroundGestures() {
        elements.canvas.addEventListener("pointerdown", (event) => {
          if (!state.backgroundImageElement || event.target.closest("button, .stamp-chip, input")) return;
          if (event.pointerType === "touch" && "ontouchstart" in window) return;
          if (event.pointerType === "mouse" && event.button !== 0) return;

          event.preventDefault();
          try {
            elements.canvas.setPointerCapture(event.pointerId);
          } catch (error) {
            console.warn("Pointer capture unavailable", error);
          }
          elements.canvas.classList.add("adjusting-background");
          backgroundPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

          if (backgroundPointers.size === 1) startBackgroundPan();
          if (backgroundPointers.size === 2) startBackgroundPinch();
        });

        elements.canvas.addEventListener("pointermove", (event) => {
          if (!backgroundPointers.has(event.pointerId) || !backgroundGesture) return;
          event.preventDefault();
          backgroundPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          updateBackgroundGesture(Array.from(backgroundPointers.values()));
        });

        const endBackgroundGesture = (event) => {
          backgroundPointers.delete(event.pointerId);
          if (backgroundPointers.size === 1) startBackgroundPan();
          else if (backgroundPointers.size === 0) {
            backgroundGesture = null;
            elements.canvas.classList.remove("adjusting-background");
          }
        };

        elements.canvas.addEventListener("pointerup", endBackgroundGesture);
        elements.canvas.addEventListener("pointercancel", endBackgroundGesture);

        elements.canvas.addEventListener("touchstart", (event) => {
          if (!state.backgroundImageElement || event.target.closest("button, .stamp-chip, input")) return;
          event.preventDefault();
          elements.canvas.classList.add("adjusting-background");
          Array.from(event.touches).forEach((touch) => {
            backgroundPointers.set(touch.identifier, { x: touch.clientX, y: touch.clientY });
          });
          if (backgroundPointers.size === 1) startBackgroundPan();
          if (backgroundPointers.size >= 2) startBackgroundPinch();
        }, { passive: false });

        elements.canvas.addEventListener("touchmove", (event) => {
          if (!backgroundGesture) return;
          event.preventDefault();
          Array.from(event.touches).forEach((touch) => {
            if (backgroundPointers.has(touch.identifier)) {
              backgroundPointers.set(touch.identifier, { x: touch.clientX, y: touch.clientY });
            }
          });
          updateBackgroundGesture(Array.from(backgroundPointers.values()));
        }, { passive: false });

        const endTouchGesture = (event) => {
          Array.from(event.changedTouches).forEach((touch) => {
            backgroundPointers.delete(touch.identifier);
          });
          if (backgroundPointers.size === 1) startBackgroundPan();
          else if (backgroundPointers.size === 0) {
            backgroundGesture = null;
            elements.canvas.classList.remove("adjusting-background");
          }
        };

        elements.canvas.addEventListener("touchend", endTouchGesture, { passive: false });
        elements.canvas.addEventListener("touchcancel", endTouchGesture, { passive: false });

        elements.canvas.addEventListener("wheel", (event) => {
          if (!state.backgroundImageElement || event.target.closest("button, .stamp-chip, input")) return;
          event.preventDefault();
          const rect = elements.canvas.getBoundingClientRect();
          const transform = state.backgroundTransform;
          const scale = Math.min(4, Math.max(1, transform.scale * (event.deltaY < 0 ? 1.08 : 0.92)));
          const pointerX = event.clientX - rect.left - rect.width / 2;
          const pointerY = event.clientY - rect.top - rect.height / 2;
          const localX = (pointerX - transform.x) / transform.scale;
          const localY = (pointerY - transform.y) / transform.scale;
          state.backgroundTransform = {
            x: pointerX - localX * scale,
            y: pointerY - localY * scale,
            scale
          };
          clampBackgroundTransform();
        }, { passive: false });
      }

      function renderCanvas() {
        elements.layout.innerHTML = "";
        elements.layout.className = "free-layout";

        if (!state.chips.length) return;

        state.chips.forEach((chip, index) => {
          const element = document.createElement("div");
          element.className = "stamp-chip";
          if (chip.selected) element.classList.add("selected");
          if (chip.text.length > 10) element.classList.add("long");
          element.dataset.id = chip.id;
          element.dataset.style = chip.style;

          if (state.mode === "flow") {
            element.style.transform = `rotate(${chip.rotation}deg)`;
          }

          element.innerHTML = `
            <span class="stamp-text">${escapeHTML(chip.text)}</span>
            <button class="stamp-delete" type="button" aria-label="删除 ${escapeHTML(chip.text)}">×</button>
            ${state.mode === "free" ? `
              <button class="stamp-rotate stamp-rotate-left" type="button" aria-label="向左旋转词贴">↺</button>
              <button class="stamp-rotate stamp-rotate-right" type="button" aria-label="向右旋转词贴">↻</button>
            ` : ""}
          `;

          element.addEventListener("click", (event) => {
            if (event.target.closest("button")) return;
            if (element.dataset.suppressClick === "true") {
              delete element.dataset.suppressClick;
              return;
            }
            selectChip(chip.id);
          });

          element.querySelector(".stamp-delete").addEventListener("click", (event) => {
            event.stopPropagation();
            state.chips = state.chips.filter((item) => item.id !== chip.id);
            if (state.selectedId === chip.id) state.selectedId = null;
            renderCanvas();
          });

          if (state.mode === "free") {
            element.style.transform = `rotate(${chip.rotation}deg)`;
            enableDrag(element, chip);

            element.querySelector(".stamp-rotate-left").addEventListener("click", (event) => {
              event.stopPropagation();
              chip.rotation = ((Number(chip.rotation) || 0) - 8 + 360) % 360;
              element.style.transform = `rotate(${chip.rotation}deg)`;
              keepChipInBounds(chip, element);
              scheduleChipControlsHide(1400);
            });

            element.querySelector(".stamp-rotate-right").addEventListener("click", (event) => {
              event.stopPropagation();
              chip.rotation = ((Number(chip.rotation) || 0) + 8) % 360;
              element.style.transform = `rotate(${chip.rotation}deg)`;
              keepChipInBounds(chip, element);
              scheduleChipControlsHide(1400);
            });
          }

          elements.layout.appendChild(element);

          if (state.mode === "free") {
            if (!chip.freePositioned) {
              const bounds = getFreeBounds();
              const column = index % 2;
              const row = Math.floor(index / 2);
              chip.x = column === 0
                ? 12
                : Math.max(22, bounds.width - element.offsetWidth - 12);
              chip.y = 18 + row * 92;
              chip.freePositioned = true;
            }
            keepChipInBounds(chip, element);
          }
        });
      }

      function selectChip(id) {
        state.selectedId = state.selectedId === id ? null : id;
        state.chips.forEach((chip) => {
          chip.selected = chip.id === state.selectedId;
        });
        elements.layout.querySelectorAll(".stamp-chip").forEach((element) => {
          element.classList.toggle("selected", Number(element.dataset.id) === state.selectedId);
        });
        if (state.selectedId === null) {
          clearChipControlsTimer();
        } else {
          scheduleChipControlsHide(2600);
        }
      }

      function clearChipControlsTimer() {
        if (chipControlsTimer !== null) {
          window.clearTimeout(chipControlsTimer);
          chipControlsTimer = null;
        }
      }

      function scheduleChipControlsHide(delay = 2200) {
        clearChipControlsTimer();
        chipControlsTimer = window.setTimeout(() => {
          chipControlsTimer = null;
          selectChip(null);
        }, delay);
      }

      function wrapCanvasText(context, text, maxWidth) {
        if (!text) return [""];
        const lines = [];
        let current = "";

        Array.from(text).forEach((character) => {
          const next = current + character;
          if (current && context.measureText(next).width > maxWidth) {
            lines.push(current);
            current = character;
          } else {
            current = next;
          }
        });

        if (current) lines.push(current);
        return lines;
      }

      function drawCanvasEdgeFade(context, width, height) {
        const fadeHeight = Math.min(72, height * 0.1);
        const topFade = context.createLinearGradient(0, 0, 0, fadeHeight);
        topFade.addColorStop(0, "rgba(253, 253, 252, 1)");
        topFade.addColorStop(1, "rgba(253, 253, 252, 0)");
        context.fillStyle = topFade;
        context.fillRect(0, 0, width, fadeHeight);

        const bottomFade = context.createLinearGradient(0, height - fadeHeight, 0, height);
        bottomFade.addColorStop(0, "rgba(253, 253, 252, 0)");
        bottomFade.addColorStop(1, "rgba(253, 253, 252, 1)");
        context.fillStyle = bottomFade;
        context.fillRect(0, height - fadeHeight, width, fadeHeight);
      }

      function drawWeatherExport(context, width, height) {
        if (!state.weatherEffectActive) return;
        const hasPhoto = Boolean(state.backgroundImageElement);
        if (state.weather === "sunny") {
          const sun = context.createRadialGradient(
            width * 0.84,
            height * 0.03,
            0,
            width * 0.84,
            height * 0.03,
            width * 0.7
          );
          sun.addColorStop(0, "rgba(255, 211, 113, 0.34)");
          sun.addColorStop(0.45, "rgba(255, 226, 157, 0.14)");
          sun.addColorStop(1, "rgba(255, 235, 185, 0)");
          context.fillStyle = sun;
          context.fillRect(0, 0, width, height);
        } else if (state.weather === "overcast") {
          const overcastBase = context.createLinearGradient(0, 0, 0, height);
          overcastBase.addColorStop(0, "rgba(106, 120, 126, 0.2)");
          overcastBase.addColorStop(0.52, "rgba(137, 148, 153, 0.14)");
          overcastBase.addColorStop(1, "rgba(156, 166, 169, 0.1)");
          context.fillStyle = overcastBase;
          context.fillRect(0, 0, width, height);

          const leftOvercast = context.createRadialGradient(
            width * 0.18, -height * 0.02, 0,
            width * 0.18, -height * 0.02, width * 0.8
          );
          leftOvercast.addColorStop(0, "rgba(88, 103, 109, 0.3)");
          leftOvercast.addColorStop(0.54, "rgba(118, 131, 136, 0.15)");
          leftOvercast.addColorStop(1, "rgba(118, 131, 136, 0)");
          context.fillStyle = leftOvercast;
          context.fillRect(0, 0, width, height);

          const rightOvercast = context.createRadialGradient(
            width * 0.9, height * 0.24, 0,
            width * 0.9, height * 0.24, width * 0.86
          );
          rightOvercast.addColorStop(0, "rgba(91, 105, 111, 0.24)");
          rightOvercast.addColorStop(0.58, "rgba(126, 138, 143, 0.12)");
          rightOvercast.addColorStop(1, "rgba(126, 138, 143, 0)");
          context.fillStyle = rightOvercast;
          context.fillRect(0, 0, width, height);
        } else if (state.weather === "cloudy") {
          [
            [0.1, 0.18, 0.42, 0.1, 0.23],
            [0.58, 0.45, 0.36, 0.08, 0.16],
            [0.18, 0.72, 0.5, 0.12, 0.12]
          ].forEach((cloud) => {
            context.save();
            context.globalAlpha = cloud[4];
            context.fillStyle = hasPhoto ? "rgba(192, 204, 208, 0.92)" : "#ffffff";
            context.shadowColor = "#ffffff";
            context.shadowBlur = 18;
            context.strokeStyle = hasPhoto ? "rgba(52, 65, 70, 0.3)" : "transparent";
            context.lineWidth = 1;
            context.beginPath();
            context.ellipse(
              width * cloud[0],
              height * cloud[1],
              width * cloud[2],
              height * cloud[3],
              -0.08,
              0,
              Math.PI * 2
            );
            context.fill();
            if (hasPhoto) context.stroke();
            context.restore();
          });
        } else if (state.weather === "rain") {
          context.save();
          context.lineCap = "round";
          const passes = hasPhoto
            ? [
                { color: "rgba(17, 26, 30, 0.7)", width: 2.4, alpha: 0.56 },
                { color: "rgba(255, 255, 255, 0.96)", width: 1.1, alpha: 0.92 }
              ]
            : [{ color: "rgba(52, 72, 82, 0.78)", width: 0.9, alpha: 1 }];
          passes.forEach((pass) => {
            context.lineWidth = pass.width;
            for (let i = 0; i < RAIN_DROPLET_COUNT; i += 1) {
              const x = getRainX(i, RAIN_DROPLET_COUNT) * width;
              const y = ((i * 83 + (i % 6) * 11) % 100) / 100 * height;
              const length = 12 + (i * 7) % 19;
              context.globalAlpha = (0.16 + (i % 5) * 0.055) * pass.alpha;
              context.strokeStyle = pass.color;
              context.beginPath();
              context.moveTo(x, y);
              context.lineTo(x - 2, y + length);
              context.stroke();
            }
          });
          context.restore();
        } else if (state.weather === "snow") {
          const snowSky = context.createLinearGradient(0, 0, 0, height);
          snowSky.addColorStop(0, "rgba(105, 123, 130, 0.15)");
          snowSky.addColorStop(0.58, "rgba(138, 154, 160, 0.1)");
          snowSky.addColorStop(1, "rgba(104, 121, 128, 0.1)");
          context.fillStyle = snowSky;
          context.fillRect(0, 0, width, height);

          const leftCloudShadow = context.createRadialGradient(
            width * 0.17, -height * 0.04, 0,
            width * 0.17, -height * 0.04, width * 0.7
          );
          leftCloudShadow.addColorStop(0, "rgba(62, 82, 91, 0.22)");
          leftCloudShadow.addColorStop(0.48, "rgba(104, 122, 130, 0.12)");
          leftCloudShadow.addColorStop(1, "rgba(104, 122, 130, 0)");
          context.fillStyle = leftCloudShadow;
          context.fillRect(0, 0, width, height);

          const rightCloudShadow = context.createRadialGradient(
            width * 0.86, height * 0.08, 0,
            width * 0.86, height * 0.08, width * 0.76
          );
          rightCloudShadow.addColorStop(0, "rgba(74, 92, 101, 0.16)");
          rightCloudShadow.addColorStop(0.52, "rgba(125, 141, 148, 0.08)");
          rightCloudShadow.addColorStop(1, "rgba(125, 141, 148, 0)");
          context.fillStyle = rightCloudShadow;
          context.fillRect(0, 0, width, height);

          for (let i = 0; i < SNOW_PARTICLE_COUNT; i += 1) {
            const x = (i * 67 + i * i * 3) % Math.max(1, Math.round(width));
            const y = (i * 43 + i * i * 5) % Math.max(1, Math.round(height));
            const sizeSeed = (i * 0.61803398875 + 0.37) % 1;
            const radius = 0.65 + Math.pow(sizeSeed, 1.8) * 3.5;
            context.save();
            context.globalAlpha = 0.42 + ((i * 11) % 38) / 100;
            context.fillStyle = "rgba(255, 255, 255, 0.96)";
            context.shadowColor = "rgba(118, 137, 144, 0.32)";
            context.shadowBlur = 2;
            context.beginPath();
            context.arc(x, y, radius, 0, Math.PI * 2);
            context.fill();
            context.restore();
          }
        } else if (state.weather === "fog") {
          const fog = context.createLinearGradient(0, 0, 0, height);
          fog.addColorStop(0, "rgba(255, 255, 255, 0)");
          fog.addColorStop(0.24, "rgba(255, 255, 255, 0.38)");
          fog.addColorStop(0.55, "rgba(236, 239, 236, 0.18)");
          fog.addColorStop(0.78, "rgba(255, 255, 255, 0.42)");
          fog.addColorStop(1, "rgba(255, 255, 255, 0)");
          context.fillStyle = fog;
          context.fillRect(0, 0, width, height);
        }
      }

      function drawExportPoster(scale = 3) {
        const width = elements.canvas.clientWidth;
        const height = elements.canvas.clientHeight;
        const output = document.createElement("canvas");
        output.width = Math.round(width * scale);
        output.height = Math.round(height * scale);
        const context = output.getContext("2d");
        context.scale(scale, scale);

        context.fillStyle = "#fbfbfa";
        context.fillRect(0, 0, width, height);

        const usingPhoto = Boolean(state.backgroundImageElement);
        if (usingPhoto) {
          const photo = state.backgroundImageElement;
          const sourceWidth = photo.naturalWidth || photo.width;
          const sourceHeight = photo.naturalHeight || photo.height;
          const coverScale = Math.max(width / sourceWidth, height / sourceHeight);
          const transform = state.backgroundTransform;
          const drawWidth = sourceWidth * coverScale * transform.scale;
          const drawHeight = sourceHeight * coverScale * transform.scale;
          context.drawImage(
            photo,
            (width - drawWidth) / 2 + transform.x,
            (height - drawHeight) / 2 + transform.y,
            drawWidth,
            drawHeight
          );
          const photoOverlay = context.createLinearGradient(0, 0, width, height);
          photoOverlay.addColorStop(0, "rgba(253,253,252,0.12)");
          photoOverlay.addColorStop(1, "rgba(17,17,17,0.31)");
          context.fillStyle = photoOverlay;
          context.fillRect(0, 0, width, height);
        } else if (state.defaultArtImage) {
          const art = state.defaultArtImage;
          const coverScale = Math.max(width / art.naturalWidth, height / art.naturalHeight);
          const drawWidth = art.naturalWidth * coverScale;
          const drawHeight = art.naturalHeight * coverScale;
          context.drawImage(
            art,
            (width - drawWidth) / 2,
            (height - drawHeight) / 2,
            drawWidth,
            drawHeight
          );
        } else {
          const light = context.createRadialGradient(
            width * 0.72,
            height * 0.34,
            width * 0.02,
            width * 0.72,
            height * 0.34,
            width * 0.46
          );
          light.addColorStop(0, "rgba(255,255,255,0.98)");
          light.addColorStop(0.28, "rgba(232,232,229,0.92)");
          light.addColorStop(0.73, "rgba(188,188,184,0.78)");
          light.addColorStop(1, "rgba(232,232,229,0)");
          context.fillStyle = light;
          context.beginPath();
          context.arc(width * 0.76, height * 0.36, width * 0.44, 0, Math.PI * 2);
          context.fill();

          context.save();
          context.translate(width * 0.75, height * 0.83);
          context.rotate(0.27);
          context.fillStyle = "#151515";
          context.beginPath();
          context.ellipse(0, 0, width * 0.25, height * 0.35, 0, 0, Math.PI * 2);
          context.fill();
          context.restore();

          const beam = context.createLinearGradient(0, 0, width, height * 0.8);
          beam.addColorStop(0, "rgba(255,255,255,0)");
          beam.addColorStop(0.52, "rgba(255,255,255,0.62)");
          beam.addColorStop(1, "rgba(255,255,255,0)");
          context.fillStyle = beam;
          context.beginPath();
          context.moveTo(width * 0.22, 0);
          context.lineTo(width * 0.5, 0);
          context.lineTo(width * 0.86, height);
          context.lineTo(width * 0.62, height);
          context.closePath();
          context.fill();
        }

        drawCanvasEdgeFade(context, width, height);
        drawWeatherExport(context, width, height);

        context.fillStyle = usingPhoto ? "rgba(255,255,255,0.84)" : "#777773";
        context.font = '7px "Courier Prime", monospace';
        context.textBaseline = "top";
        context.fillText(shortDate.toUpperCase(), 16, 15);

        const countLabel = `${String(state.chips.length).padStart(2, "0")} FRAGMENTS`;
        context.fillStyle = usingPhoto ? "rgba(255,255,255,0.68)" : "#9e9e9a";
        context.textAlign = "right";
        context.fillText(countLabel, width - 16, 15);
        context.textAlign = "left";

        const canvasRect = elements.canvas.getBoundingClientRect();
        const layoutRect = elements.layout.getBoundingClientRect();

        elements.layout.querySelectorAll(".stamp-chip").forEach((element) => {
          const chip = state.chips.find((item) => String(item.id) === element.dataset.id);
          if (!chip) return;

          const textElement = element.querySelector(".stamp-text");
          if (!textElement) return;

          const textStyle = window.getComputedStyle(textElement);
          const boxWidth = element.offsetWidth;
          const boxHeight = element.offsetHeight;
          const x = layoutRect.left - canvasRect.left + element.offsetLeft;
          const y = layoutRect.top - canvasRect.top + element.offsetTop;
          const rotation = (Number(chip.rotation) || 0) * Math.PI / 180;

          context.save();
          context.translate(x + boxWidth / 2, y + boxHeight / 2);
          context.rotate(rotation);
          context.translate(-boxWidth / 2, -boxHeight / 2);
          context.textAlign = "left";
          context.textBaseline = "top";

          context.fillStyle = textStyle.color;
          const fontSize = parseFloat(textStyle.fontSize) || 18;
          context.font = `${textStyle.fontWeight} ${fontSize}px ${textStyle.fontFamily}`;
          const parsedLineHeight = parseFloat(textStyle.lineHeight);
          const lineHeight = Number.isFinite(parsedLineHeight) ? parsedLineHeight : fontSize * 1.45;
          const lines = wrapCanvasText(context, textElement.textContent, textElement.clientWidth);
          lines.forEach((line, lineIndex) => {
            context.fillText(
              line,
              textElement.offsetLeft,
              textElement.offsetTop + lineIndex * lineHeight
            );
          });
          context.restore();
        });

        return output;
      }

      function addWord() {
        const text = elements.input.value.trim();
        if (!text) {
          showToast("先写下一个词");
          elements.input.focus();
          return;
        }

        const chip = {
          id: state.nextId++,
          text,
          type: state.selectedType,
          style: styles[(state.nextId + state.chips.length) % styles.length],
          rotation: (Math.random() * 5.4 - 2.7).toFixed(1),
          x: 0,
          y: 0,
          freePositioned: false,
          selected: false
        };

        state.chips.push(chip);
        elements.input.value = "";
        closeSheet();
        state.selectedId = null;
        renderCanvas();
        showToast(`已收下「${text}」`);
      }

      function enableDrag(element, chip) {
        let pointerId = null;
        let startX = 0;
        let startY = 0;
        let startLeft = 0;
        let startTop = 0;
        let moved = false;
        let pointerWasActive = false;

        element.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || event.target.closest(".stamp-delete, .stamp-rotate")) return;
          clearChipControlsTimer();
          pointerId = event.pointerId;
          pointerWasActive = true;
          moved = false;
          startX = event.clientX;
          startY = event.clientY;
          startLeft = Number(chip.x) || 0;
          startTop = Number(chip.y) || 0;
          element.setPointerCapture(pointerId);
        });

        element.addEventListener("pointermove", (event) => {
          if (event.pointerId !== pointerId) return;
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
          if (!moved) return;

          if (!element.classList.contains("dragging")) {
            element.classList.add("selected", "dragging");
            state.selectedId = chip.id;
            state.chips.forEach((item) => {
              item.selected = item.id === chip.id;
            });
          }

          chip.x = startLeft + dx;
          chip.y = startTop + dy;
          element.style.left = `${chip.x}px`;
          element.style.top = `${chip.y}px`;
          keepChipInBounds(chip, element);
        });

        const endDrag = (event) => {
          if (event.pointerId !== pointerId) return;
          pointerId = null;
          element.classList.remove("dragging");
          if (pointerWasActive && moved && event.type === "pointerup") {
            element.dataset.suppressClick = "true";
            scheduleChipControlsHide(180);
            window.setTimeout(() => {
              delete element.dataset.suppressClick;
            }, 80);
          }
          pointerWasActive = false;
        };

        element.addEventListener("pointerup", endDrag);
        element.addEventListener("pointercancel", endDrag);
      }

      function openSheet(name) {
        closeSheet();
        const sheet = elements.sheets[name];
        if (!sheet) return;
        state.activeSheet = name;
        sheet.classList.add("open");
        sheet.setAttribute("aria-hidden", "false");
        elements.scrim.classList.add("open");
        document.body.classList.add("sheet-open");
        elements.addButton.setAttribute("aria-expanded", String(name === "composer"));

        if (name === "composer") {
          window.setTimeout(() => elements.input.focus({ preventScroll: true }), 220);
        }
      }

      function closeSheet() {
        Object.values(elements.sheets).forEach((sheet) => {
          sheet.classList.remove("open");
          sheet.setAttribute("aria-hidden", "true");
        });
        elements.scrim.classList.remove("open");
        document.body.classList.remove("sheet-open");
        elements.addButton.setAttribute("aria-expanded", "false");
        state.activeSheet = null;
      }

      function getHistory() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function saveToHistory() {
        if (!state.chips.length) return;
        const history = getHistory();
        const entry = {
          id: Date.now(),
          date: dateLabel,
          preview: state.chips.map((chip) => chip.text).join(" / "),
          mode: state.mode,
          weather: state.weather,
          weatherEffectActive: state.weatherEffectActive,
          backgroundImage: state.backgroundImage,
          backgroundTransform: state.backgroundTransform,
          chips: state.chips.map(({ selected, ...chip }) => chip)
        };
        history.unshift(entry);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 12)));
      }

      function renderHistory() {
        const history = getHistory();
        if (!history.length) {
          elements.historyList.innerHTML = '<div class="history-empty">还没有保存过诗页</div>';
          return;
        }

        elements.historyList.innerHTML = history.map((entry) => `
          <div class="history-item">
            <button class="history-open" type="button" data-history-id="${entry.id}">
              <span class="history-date">${escapeHTML(entry.date)} · ${escapeHTML(entry.mode === "free" ? "自由排版" : "自动排列")}</span>
              <span class="history-preview">${escapeHTML(entry.preview)}</span>
              <span class="history-action">重新打开这一页 <span class="arrow-icon" aria-hidden="true"></span></span>
            </button>
            <button class="history-delete" type="button" data-delete-history-id="${entry.id}" aria-label="删除 ${escapeHTML(entry.date)} 的日记">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 7h15M9 7V4.8h6V7M7.5 7l.8 12.2h7.4L16.5 7M10 10.2v6M14 10.2v6"/>
              </svg>
            </button>
          </div>
        `).join("");

        elements.historyList.querySelectorAll("[data-history-id]").forEach((button) => {
          button.addEventListener("click", async () => {
            const entry = history.find((item) => String(item.id) === button.dataset.historyId);
            if (!entry) return;
            state.chips = (entry.chips || []).map((chip) => ({ ...chip, selected: false }));
            if (entry.mode !== "free") {
              state.chips.forEach((chip) => {
                chip.freePositioned = false;
              });
            }
            state.nextId = Math.max(1, ...state.chips.map((chip) => Number(chip.id) + 1));
            state.selectedId = null;
            closeSheet();
            await restoreBackground(entry.backgroundImage || "", entry.backgroundTransform);
            setWeather(entry.weather || "sunny", true);
            if (entry.weatherEffectActive === false) clearWeatherEffect();
            renderCanvas();
            showToast("已打开保存的诗页");
          });
        });

        elements.historyList.querySelectorAll("[data-delete-history-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const historyEntry = history.find(
              (item) => String(item.id) === button.dataset.deleteHistoryId
            );
            if (!historyEntry) return;
            if (!window.confirm(`确定删除「${historyEntry.date}」这条日记吗？`)) return;

            const remaining = history.filter(
              (item) => String(item.id) !== button.dataset.deleteHistoryId
            );
            localStorage.setItem(STORAGE_KEY, JSON.stringify(remaining));
            renderHistory();
            showToast("日记已删除");
          });
        });
      }

      async function copyPoem() {
        const text = state.chips.map((chip) => chip.text).join("\n");
        if (!text) {
          showToast("这一页还没有词");
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          closeSheet();
          showToast("诗句已复制");
        } catch {
          showToast("复制失败，请手动选择文字");
        }
      }

      async function exportPoem() {
        if (!state.chips.length) {
          showToast("先收集几个词，再保存诗页");
          return;
        }

        state.selectedId = null;
        state.chips.forEach((chip) => { chip.selected = false; });
        renderCanvas();
        saveToHistory();
        showToast("正在生成诗页…");

        try {
          const canvas = drawExportPoster(Math.min(3, Math.max(2, window.devicePixelRatio || 1)));
          const link = document.createElement("a");
          link.download = `拼贴诗日记_${today.getFullYear()}${today.getMonth() + 1}${today.getDate()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.style.display = "none";
          document.body.appendChild(link);
          link.click();
          link.remove();
          showToast("诗页已保存到日记");
        } catch (error) {
          console.error(error);
          showToast("生成图片失败，请稍后再试");
        }
      }

      elements.typeStrip.addEventListener("click", (event) => {
        const button = event.target.closest(".type-btn");
        if (!button) return;
        elements.typeStrip.querySelectorAll(".type-btn").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        state.selectedType = button.dataset.type;
        elements.selectedTypeLabel.textContent = `当前 · ${state.selectedType}`;
      });

      document.querySelectorAll("[data-pick-background]").forEach((button) => {
        button.addEventListener("click", () => {
          elements.backgroundFile.value = "";
          elements.backgroundFile.click();
        });
      });

      elements.backgroundFile.addEventListener("change", () => {
        const [file] = elements.backgroundFile.files || [];
        if (file) usePhotoBackground(file);
      });

      elements.removeBackgroundButton.addEventListener("click", () => {
        state.backgroundImage = "";
        state.backgroundImageElement = null;
        state.backgroundTransform = { x: 0, y: 0, scale: 1 };
        applyBackgroundState();
        closeSheet();
        showToast("已恢复默认背景");
      });

      elements.wordForm.addEventListener("submit", (event) => {
        event.preventDefault();
        addWord();
      });

      elements.weatherButtons.forEach((button) => {
        button.addEventListener("click", () => setWeather(button.dataset.weather));
      });
      elements.weatherTrigger.addEventListener("click", openWeatherPicker);

      elements.addButton.addEventListener("click", () => {
        if (state.activeSheet === "composer") closeSheet();
        else openSheet("composer");
      });
      elements.menuButton.addEventListener("click", () => openSheet("menu"));
      elements.historyButton.addEventListener("click", () => {
        renderHistory();
        openSheet("history");
      });
      elements.exportButton.addEventListener("click", exportPoem);
      elements.copyButton.addEventListener("click", copyPoem);
      elements.clearTextButton.addEventListener("click", () => {
        if (!state.chips.length) {
          showToast("画布上还没有文字");
          return;
        }
        if (window.confirm("确定清空画布上的全部文字吗？")) {
          state.chips = [];
          state.selectedId = null;
          clearChipControlsTimer();
          closeSheet();
          renderCanvas();
          showToast("文字已清空");
        }
      });
      elements.clearWeatherButton.addEventListener("click", () => {
        if (!state.weatherEffectActive) {
          showToast("当前没有天气效果");
          return;
        }
        if (window.confirm("确定清除当前的天气效果吗？")) {
          clearWeatherEffect();
          closeSheet();
          showToast("天气已清空");
        }
      });

      elements.scrim.addEventListener("click", closeSheet);
      document.querySelectorAll("[data-close-sheet]").forEach((button) => {
        button.addEventListener("click", closeSheet);
      });
      elements.canvas.addEventListener("pointerdown", (event) => {
        if (!event.target.closest(".stamp-chip, button, input")) selectChip(null);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.activeSheet) closeSheet();
        else selectChip(null);
      });

      window.addEventListener("resize", () => {
        elements.layout.querySelectorAll(".stamp-chip").forEach((element) => {
          const chip = state.chips.find((item) => item.id === Number(element.dataset.id));
          if (chip) keepChipInBounds(chip, element);
        });
        clampBackgroundTransform();
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshDate();
      });
      window.addEventListener("focus", () => refreshDate());
      window.setInterval(() => refreshDate(), 60 * 1000);

      applyBackgroundState();
      enableBackgroundGestures();
      prepareRainParticles();
      prepareSnowParticles();
      setWeather(state.weather, false);
      scheduleDateRefresh();
      prepareDefaultArtwork();
      renderCanvas();
    })();
  </script>
</body>
</html>
